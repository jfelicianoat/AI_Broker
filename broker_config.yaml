server:
  host: 0.0.0.0
  port: 8765
  workers: 1
  cors_enabled: false
  cors_allow_origins: []
  admin_token_env: AI_BROKER_ADMIN_TOKEN
  admin_keyring_service: ai-broker
  admin_keyring_username: dashboard_admin_token
  allow_unauthenticated_lan: false
  publish_session_token: keyring
  session_token_keyring_username: session_admin_token
persistence:
  database: state/broker.db
  journal_mode: WAL
  events_retention_days: 30
  artifacts_retention_days: 0
  files_retention_days: 0
processing:
  max_active_workflows: 1
  max_parallel_invocations: auto
  queue_max_size: 1000
  task_timeout_seconds: 3000
  default_task_timeout_seconds: 2400
  max_task_attempts: 3
  unload_after_task: false
  idle_unload_seconds: 900.0
  auto_dispatch: true
  dispatcher_interval_seconds: 0.1
  provider_mode: real
  dependency_wait_seconds: 2.0
prompt_compression:
  enabled: true
  level: aggressive
  min_chars: 40
ingestion:
  enabled: true
  storage_dir: state/files
  max_file_mb: 8192
  max_pdf_pages: 5000
  ocr_enabled: true
  ocr_languages:
  - es
  - en
  conversion_timeout_seconds: 7200
  max_concurrent: 2
  isolate_conversions: true
  images:
    enabled: true
    base_url: http://127.0.0.1:1234/v1
    model: google/gemma-4-31b-qat
    api_key_env: null
    timeout_seconds: 180.0
    max_images: 20
  transcription:
    enabled: true
    model_size: small
    device: auto
    language: null
    ffmpeg_path: C:\Users\pcesp\AppData\Local\Microsoft\WinGet\Packages\Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe\ffmpeg-8.1.2-full_build\bin\ffmpeg.exe
sandbox:
  enabled: true
  docker_path: docker
  image: ai-broker-sandbox:latest
  timeout_seconds: 60.0
  memory_mb: 1024
  cpus: 2.0
  pids_limit: 256
  max_output_chars: 8000
  work_volume_mb: 256
mcp:
  enabled: false
  servers: []
  startup_timeout_seconds: 20.0
resources:
  local_vram_budget_gb: 64.0
  vram_safety_margin_gb: 2.0
  unified_memory_budget_gb: 112.0
  gpu_layer_offload: true
  gpu_offload_reserve_ratio: 0.2
  gpu_context_sizing: true
  gpu_context_minimum_tokens: 4096
  max_loaded_local_models: auto
  scheduling_policy: adaptive
  allow_execution_waves: true
  memory_wait_seconds: 20.0
  memory_reserve_after: 5
  memory_reserve_window_seconds: 300.0
routing:
  adaptive_selection: true
  stats_window_days: 7
  min_invocations: 3
  exploration_rate: 0.15
model_quarantine:
  enabled: true
  consecutive_failures: 2
  window_hours: 24.0
  definitive_codes:
  - INVALID_PROVIDER_RESPONSE
  - PROMPT_ECHOED
  - DEGENERATE_OUTPUT
  - MODEL_COMPATIBILITY_MISMATCH
  - MODEL_UNAVAILABLE
  - MODEL_DEPLOYMENT_MISMATCH
shadow_probe:
  enabled: true
  probe_local_models: true
  max_prompt_chars: 8000
task_affinity:
  enabled: true
  exclude_always:
  - '*guard*'
  - '*safety*'
  - '*topic-control*'
  - '*-pii*'
  - '*-ocr*'
  - ocr-*
  - '*translate*'
  - '*detector*'
  - '*calibration*'
  exclude_by_task_type:
    code: []
    long_context:
    - '*-coder*'
    - '*_coder*'
    - '*starcoder*'
    - '*codestral*'
    - '*codegemma*'
    - '*codellama*'
    - '*-code-*'
    - '*-code'
    - '*-code:*'
    prose:
    - '*-coder*'
    - '*_coder*'
    - '*starcoder*'
    - '*codestral*'
    - '*codegemma*'
    - '*codellama*'
    - '*-code-*'
    - '*-code'
    - '*-code:*'
strategy_router:
  enabled: true
  heuristic_classifier: true
  confidence_escalation: true
  adaptive_learning: false
  record_cases: true
  mixture_min_prompt_chars: 600
  mixture_min_budget_usd: 0.0
  escalation_min_confidence: 0.6
  learning_min_cases: 5
  learning_escalation_threshold: 0.5
  learning_failure_threshold: 0.4
model_enrichment:
  enabled: true
  url: https://models.dev/api.json
  refresh_hours: 24.0
  timeout_seconds: 20.0
health:
  sqlite_interval_seconds: 10
  local_dependencies_interval_seconds: 30
  external_providers_interval_seconds: 300
  disk_free_alert_gb: 10
  probe_timeout_seconds: 5.0
logging:
  level: INFO
  directory: logs
  filename: ai-broker.log
  max_bytes: 10485760
  backup_count: 5
  console_enabled: true
providers:
  ollama:
    enabled: true
    base_url: http://127.0.0.1:11434
    timeout_seconds: 2400.0
    unload_timeout_seconds: 10.0
    catalog_cache_seconds: 5.0
  deepseek:
    enabled: false
    base_url: https://api.deepseek.com
    timeout_seconds: 300.0
    api_key_env: DEEPSEEK_API_KEY
    keyring_service: ai-broker
    keyring_username: deepseek_api_key
    default_model: deepseek-chat
    context_window: 64000
    input_cost_per_million: 0.0
    output_cost_per_million: 0.0
    catalog_cache_seconds: 30.0
